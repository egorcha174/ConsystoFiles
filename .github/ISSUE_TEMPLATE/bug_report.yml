name: Сообщить об ошибке
description: Что-то работает не так, как ожидалось
title: 'Ошибка: '
labels: ['bug']
body:

  - type: textarea
    attributes:
      label: Что произошло
      description: Что вы делали, что ожидали увидеть и что увидели вместо этого.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Как повторить
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: Версия программы
      description: «Настройки → О приложении».
      placeholder: 'например, 1.26.921.1014'
    validations:
      required: true

  - type: input
    id: windows_version
    attributes:
      label: Версия Windows
      description: 'Параметры → Система → О системе.'
      placeholder: 'например, 10.0.26100'
    validations:
      required: false

  - type: textarea
    id: cad
    attributes:
      label: Если дело в чертеже или модели
      description: >
        Какой формат файла и в какой программе он сохранён. **Сам файл присылать не надо**:
        в нём может быть работа вашего заказчика. Достаточно формата и названия программы.
      placeholder: 'например, .sldprt из SolidWorks 2024'
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        Журнал работы лежит в папке `data` рядом с программой. Прикладывать его не обязательно,
        но он помогает. Перед отправкой уберите из него то, что не хотите показывать, —
        имена дисков, папок и заказчиков.
