<!doctype html>
<!-- Consysto fork: the terminal tab's emulator. The shell runs in the app; this page only draws and sends keys. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="xterm.css">
<style>
	html, body { margin: 0; height: 100%; overflow: hidden; background: var(--background, #1e1e1e); }
	#terminal { position: absolute; inset: 6px 4px 4px 10px; }
</style>
</head>
<body>
<div id="terminal"></div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script>
	const host = window.chrome.webview;
	const query = new URLSearchParams(location.search);
	const dark = query.get('theme') !== 'light';
	const theme = dark
		? { background: '#1e1e1e', foreground: '#d4d4d4', cursor: '#d4d4d4', selectionBackground: '#264f78' }
		: { background: '#ffffff', foreground: '#1f1f1f', cursor: '#1f1f1f', selectionBackground: '#add6ff',
			black: '#000000', brightBlack: '#666666', white: '#aaaaaa', brightWhite: '#555555', yellow: '#946b00', brightYellow: '#7a5a00' };
	document.body.style.setProperty('--background', theme.background);

	const term = new Terminal({
		fontFamily: "'Cascadia Mono', Consolas, 'Courier New', monospace",
		fontSize: Number(query.get('fontSize')) || 13,
		cursorBlink: true,
		scrollback: 5000,
		theme,
	});
	const fit = new FitAddon.FitAddon();
	term.loadAddon(fit);
	term.open(document.getElementById('terminal'));

	const send = message => host.postMessage(JSON.stringify(message));
	const resize = () => { fit.fit(); send({ type: 'resize', columns: term.cols, rows: term.rows }); };

	term.onData(data => send({ type: 'input', data }));

	// Ctrl+C copies when there is a selection, otherwise it interrupts; Ctrl+V pastes.
	term.attachCustomKeyEventHandler(event => {
		if (event.type !== 'keydown' || !event.ctrlKey || event.altKey)
			return true;
		// The key is recognised by its place on the keyboard, not by the letter it types: with a Russian layout Ctrl+C and
		// Ctrl+V arrive as Ctrl+С and Ctrl+М. The clipboard itself goes through the program, since the browser engine
		// refuses to read it without asking the user every time.
		if (event.code === 'KeyC' && term.hasSelection()) {
			send({ type: 'selection', data: term.getSelection() });
			term.clearSelection();
			return false;
		}
		if (event.code === 'KeyV') {
			send({ type: 'pasteRequest' });
			return false;
		}
		return true;
	});

	host.addEventListener('message', event => {
		const message = event.data;
		if (message.type === 'output')
			term.write(message.data);
		else if (message.type === 'exited')
			term.write('\r\n\x1b[90m' + message.text + '\x1b[0m\r\n');
		else if (message.type === 'focus')
			term.focus();
		// Commands of the context menu of the tab
		// Ctrl+C copies the selection, and interrupts the running command when there is nothing selected
		else if (message.type === 'copy') {
			if (term.hasSelection()) {
				send({ type: 'selection', data: term.getSelection() });
				term.clearSelection();
			}
			else {
				send({ type: 'input', data: '\x03' });
			}
		}
		else if (message.type === 'paste')
			send({ type: 'pasteRequest' });
		else if (message.type === 'clear') {
			term.clear();
			term.focus();
		}
		else if (message.type === 'selectAll')
			term.selectAll();
	});

	// The web view shows no menu of its own; the tab offers its own one instead
	document.addEventListener('contextmenu', event => {
		event.preventDefault();
		send({ type: 'menu', hasSelection: term.hasSelection() });
	});

	new ResizeObserver(resize).observe(document.getElementById('terminal'));
	resize();
	term.focus();
	send({ type: 'ready', columns: term.cols, rows: term.rows });
</script>
</body>
</html>
